name: Welcome First-Time Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Welcome First-Time Issue Reporter
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const creator = context.payload.sender.login;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator,
              state: 'all',
            });

            if (issues.length === 1) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `👋 Hey @${creator}, welcome to **AxialNet**! Thanks for opening your first issue.\n\nA maintainer will review this shortly. In the meantime:\n- 📖 Check our [docs](https://axialnet.vercel.app/docs) for answers\n- 💬 Join the [discussion](https://github.com/Axialnet/.github/discussions) for questions\n- 📋 Review our [contributing guidelines](https://github.com/Axialnet/.github/blob/main/CONTRIBUTING.md)\n\nWe appreciate your contribution! 🚀`
              });
            }

      - name: Welcome First-Time PR Author
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            const creator = context.payload.sender.login;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
            });

            const userPRs = prs.filter(pr => pr.user.login === creator);

            if (userPRs.length === 1) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `🎉 Hey @${creator}, congrats on your first pull request to **AxialNet**!\n\nA maintainer will review your changes soon. Please make sure:\n- ✅ Your PR follows our [contributing guidelines](https://github.com/Axialnet/.github/blob/main/CONTRIBUTING.md)\n- ✅ You've reviewed the [code of conduct](https://github.com/Axialnet/.github/blob/main/CODE_OF_CONDUCT.md)\n- ✅ Your changes are well-described in the PR description\n\nThank you for contributing! 💙`
              });
            }
