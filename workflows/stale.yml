name: Mark and Close Stale Issues & PRs

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Handle Stale Issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # ── Stale Issues ──────────────────────────────────────────
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: "stale"
          stale-issue-message: >
            👋 This issue has been inactive for **30 days** and is now marked as stale.
            If this is still relevant, please leave a comment or update the issue.
            It will be **automatically closed in 7 days** if there is no activity.
          close-issue-message: >
            🔒 This issue has been closed due to inactivity.
            Feel free to reopen it if it's still relevant, or start a new one with updated details.

          # ── Stale PRs ─────────────────────────────────────────────
          days-before-pr-stale: 21
          days-before-pr-close: 7
          stale-pr-label: "stale"
          stale-pr-message: >
            👋 This pull request has been inactive for **21 days** and is now marked as stale.
            Please update your PR or leave a comment if you're still working on it.
            It will be **automatically closed in 7 days** if there is no activity.
          close-pr-message: >
            🔒 This PR has been closed due to inactivity.
            If you'd like to continue, feel free to reopen it or submit a fresh PR.

          # ── Exemptions ────────────────────────────────────────────
          exempt-issue-labels: "pinned,security,in-progress,blocked"
          exempt-pr-labels: "pinned,in-progress,blocked,do-not-close"
          exempt-all-assignees: true        # Don't stale assigned issues/PRs
          exempt-all-milestones: true       # Don't stale milestoned items

          # ── Limits ────────────────────────────────────────────────
          operations-per-run: 100           # GitHub API rate limit safety
          remove-stale-when-updated: true   # Un-stale if activity resumes
          ascending: true                   # Process oldest items first
